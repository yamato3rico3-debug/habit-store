iv class="detail"><div><img src="'+img(p[0]==='standard'?'detail':p[0])+'" alt="'+p[1]+'の商品デザイン"><div class="muted">※ パッケージ画像はデザイン案です。</div></div><div><h1>'+p[1]+'</h1><p>'+p[2]+'</p><div class="price">'+yen(p[3])+' <small>（税込・価格案）</small></div><p>持ち歩ける、黒にんにくの新しいかたち。<br>毎日に、小さなひとつ。<br>自然の恵みを、シンプルにおいしく。</p><div class="quantity"><button onclick="q=Math.max(1,q-1);render()">−</button><span>'+q+'</span><button onclick="q++;render()">＋</button></div><button class="btn dark" onclick="add(\''+p[0]+'\')">カートに入れる</button><p><button class="btn" onclick="add(\''+p[0]+'\')">今すぐ購入する（デモ）</button></p><div class="tabs">商品概要　　原材料　　栄養成分　　ご注意<hr>KURO HITOTSUは、毎日に小さな「ひとつ」を。<br>※ 原材料・栄養成分は製品仕様確定後に掲載します。</div></div></div></div>'}function add(id){bag[id]=(bag[id]||0)+q;q=1;go('/cart')}function change(id,n){bag[id]=Math.max(0,(bag[id]||0)+n);render()}function steps(i){return '<div class="steps">'+['カート','お届け先','お支払い','確認'].map((s,j)=>'<span class="'+(i===j?'active':'')+'">'+(j+1)+' '+s+'</span>').join('')+'</div>'}function cartrows(){return ps.filter(p=>bag[p[0]]).map(p=>'<div class="cartrow"><img src="'+img(p[0])+'"><div>'+p[1]+'<p class="muted">'+p[2]+'</p><button class="smallbtn" onclick="change(\''+p[0]+'\',-1)">−</button> '+bag[p[0]]+' <button class="smallbtn" onclick="change(\''+p[0]+'\',1)">＋</button></div><div class="right">'+yen(p[3]*bag[p[0]])+'</div></div>').join('')}function cart(){return '<div class="checkout"><h1>Shopping Bag</h1>'+steps(0)+(cnt()?cartrows()+'<div class="totals"><span>合計（商品代金）</span><b>'+yen(sum())+'</b></div><p class="muted">送料は未確定です。</p><div class="actions"><a class="btn" href="#/shop">買い物を続ける</a><button class="btn dark" onclick="go(\'/address\')">購入手続きへ →</button></div>':'<p>カートは空です。</p><a class="btn" href="#/shop">商品を見る</a>')+'</div>'}function address(){return '<div class="checkout"><h1>お届け先</h1>'+steps(1)+'<div class="notice">これはデモです。実際の個人情報は入力しないでください。情報は送信・保存されません。</div><form onsubmit="event.preventDefault();delivery=Object.fromEntries(new FormData(thi
