function render(){let path=decodeURIComponent(location.hash.replace(/^#/,'')||'/');if(path.startsWith('/product/')){let p=products.find(p=>p.id===path.split('/')[2]);app.innerHTML=p?detail(p):shop()}else app.innerHTML=({'/':home,'/shop':shop,'/story':()=>'<div class="container">'+banner()+'<section class="copy"><h2>日々に、小さなひとつ。</h2><p>自然の恵みを、毎日の習慣に。<br>KURO HITOTSU — A small ritual for your special days.</p></section></div>','/cart':cart,'/address':address,'/payment':payment,'/confirm':confirm,'/complete':complete}[path]||home)();window.scrollTo(0,0);sync()}window.addEventListener('hashchange',render);render();
</script></body></html>
