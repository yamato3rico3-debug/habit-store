<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KURO HITOTSU | Daily Ritual</title><style>*{box-sizing:border-box}body{margin:0;color:#293c39;background:#f6f5f0;font-family:Arial,"Helvetica Neue",sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:22px 6%;background:white;position:sticky;top:0;z-index:2}header b{letter-spacing:.22em;font-size:17px}button{cursor:pointer;border:0}header button,.outline{background:transparent;color:#293c39;border:1px solid #293c39;padding:12px 16px}.hero{background:#dce5df;padding:85px 7% 75px;min-height:420px}.eyebrow{letter-spacing:.3em;font-size:11px}.hero h1{font-size:clamp(46px,10vw,100px);font-weight:400;line-height:1.02;letter-spacing:-.065em;margin:30px 0}.hero p{line-height:2}.primary{background:#293c39;color:white;padding:17px 22px;font-size:13px;letter-spacing:.1em}.section{padding:70px 6%}.section h2{font-weight:400;font-size:38px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.product{background:white;padding:18px}.art{height:290px;background:linear-gradient(145deg,#e1e7e1,#b8c7bb);display:flex;align-items:center;justify-content:center;overflow:hidden}.art span{display:block;background:#f4f2e8;border:1px solid #ddd7c9;padding:55px 18px;box-shadow:15px 20px 20px #0002;transform:rotate(-9deg);letter-spacing:.14em;text-align:center;font-size:12px}.product h3{font-weight:400;font-size:24px}.product p{color:#65726b;font-size:13px}.product button{width:100%;margin-top:14px}.price{font-size:21px}#cart{display:none;position:fixed;inset:0;background:#0007;z-index:5;align-items:center;justify-content:flex-end}#cart.open{display:flex}.panel{width:min(100%,470px);height:100%;background:white;padding:28px;overflow:auto}.panel-top{display:flex;justify-content:space-between;align-items:center}.panel-top button{background:transparent;font-size:28px}.line{padding:18px 0;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;gap:12px}.qty button{background:#e6ebe7;padding:7px 12px}.total{display:flex;justify-content:space-between;font-size:22px;margin:24px 0}label{display:block;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #bbb;border-radius:0;font-size:16px}.panel .primary{width:100%;margin-top:15px}footer{text-align:center;padding:60px 10%;font-size:12px;letter-spacing:.1em}@media(max-width:680px){.products{grid-template-columns:1fr}.art{height:350px}.section{padding:48px 6%}.hero{padding-top:65px}}</style></head><body><header><b>KURO HITOTSU</b><button onclick="showCart()">BAG (<span id="count">0</span>)</button></header><main><section class="hero"><div class="eyebrow">A SMALL RITUAL FOR YOUR DAY</div><h1>Natural ritual.<br>Every day.</h1><p>黒ひとつ。毎日に、小さなひとつを。<br>黒にんにくから始まる新しい習慣。</p><button class="primary" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">EXPLORE COLLECTION →</button></section><section class="section" id="shop"><div class="eyebrow">THE COLLECTION</div><h2>Find your ritual.</h2><div class="products" id="products"></div></section></main><footer>KURO HITOTSU — MADE FOR EVERYDAY RITUALS<br><br>※こちらは販売サイトのデモです。実際の注文・決済は行われません。</footer><div id="cart" role="dialog" aria-modal="true"><div class="panel"><div class="panel-top"><h2 id="cartTitle">Shopping Bag</h2><button onclick="hideCart()" aria-label="閉じる">×</button></div><div id="cartBody"></div></div></div><script>const items=[{name:'TRIAL',sub:'黒にんにくゼリー 5本',price:980},{name:'STANDARD',sub:'黒にんにくゼリー 20本',price:3980},{name:'VALUE',sub:'黒にんにくゼリー 30本',price:4980}];const cart={};const yen=n=>'¥'+n.toLocaleString('ja-JP');document.getElementById('products').innerHTML=items.map((p,i)=>'<article class="product"><div class="art"><span>KURO<br>HITOTSU<br><br>'+p.name+'<br>BLACK GARLIC</span></div><h3>'+p.name+'</h3><p>'+p.sub+'</p><div class="price">'+yen(p.price)+'</div><button class="primary" onclick="add('+i+')">カートに入れる ＋</button></article>').join('');function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}function total(){return items.reduce((a,p,i)=>a+p.price*(cart[i]||0),0)}function add(i){cart[i]=(cart[i]||0)+1;update();showCart()}function change(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);update();renderCart()}function update(){document.getElementById('count').textContent=count()}function showCart(){document.getElementById('cart').classList.add('open');renderCart()}function hideCart(){document.getElementById('cart').classList.remove('open')}function renderCart(){document.getElementById('cartTitle').textContent='Shopping Bag';document.getElementById('cartBody').innerHTML=count()?items.map((p,i)=>cart[i]?'<div class="line"><div><b>'+p.name+'</b><p>'+p.sub+'</p><div class="qty"><button onclick="change('+i+',-1)">−</button>　'+cart[i]+'　<button onclick="change('+i+',1)">＋</button></div></div><b>'+yen(p.price*cart[i])+'</b></div>':'').join('')+'<div class="total"><span>合計</span><b>'+yen(total())+'</b></div><button class="primary" onclick="checkout()">購入手続きへ →</button>':'<p>カートは空です。</p><button class="primary" onclick="hideCart()">買い物を続ける</button>'}function checkout(){document.getElementById('cartTitle').textContent='Checkout / デモ';document.getElementById('cartBody').innerHTML='<p>ご注文内容　'+count()+'点 / '+yen(total())+'</p><form onsubmit="event.preventDefault();complete()"><label>お名前</label><input required placeholder="山田 太郎"><label>メールアドレス</label><input required type="email" placeholder="name@example.com"><label>お届け先（デモ）</label><input required placeholder="都道府県・住所"><p>※デモのため入力情報は送信・保存されません。</p><button class="primary" type="submit">デモ注文を確認する →</button></form><button class="outline" onclick="renderCart()">カートに戻る</button>'}function complete(){document.getElementById('cartTitle').textContent='Thank you.';document.getElementById('cartBody').innerHTML='<h2>ご確認ありがとうございます。</h2><p>デモ注文が完了しました。実際の注文・請求は発生しません。</p><button class="primary" onclick="reset()">ショップに戻る</button>'}function reset(){Object.keys(cart).forEach(k=>delete cart[k]);update();hideCart()}document.getElementById('cart').addEventListener('click',e=>{if(e.target.id==='cart')hideCart()});</script></body></html>
